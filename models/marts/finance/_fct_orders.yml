version: 2

models:
  - name: fct_orders
    description: Order fact table with one row per order, including the customer, order date, and total successful payment amount. Orders without successful payments are retained with an amount of zero.
    columns:
      - name: order_id
        description: Primary key and stable identifier for the order.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Customer who placed the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id
      - name: order_date
        description: Date when the order was placed.
        data_tests:
          - not_null
      - name: amount
        description: Total successful payment amount for the order in dollars, defaulting to zero when no successful payment exists.
        data_tests:
          - not_null
