version: 2

models:
  - name: stg_jaffle_shop__customers
    description: Cleaned customer records from the Jaffle Shop application, with one row per customer. This model is the canonical customer input for downstream transformations.
    columns:
      - name: customer_id
        description: Primary key and stable identifier for the customer, renamed from the source `id` field.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer's given name as recorded in the Jaffle Shop application.
      - name: last_name
        description: Customer's family name as recorded in the Jaffle Shop application.


  - name: stg_jaffle_shop__orders
    description: One order per row
    columns:
      - name: order_id
        description: Primary key for the orders table
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id
      - name: order_date
      - name: order_status
        description: "{{ doc('order_status') }}"
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - placed
                  - shipped
                  - completed
                  - return_pending
                  - returned
      - name: _etl_loaded_at
